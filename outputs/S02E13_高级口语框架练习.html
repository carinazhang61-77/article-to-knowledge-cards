<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S02E13 高级口语框架练习</title><style>
:root{--ink:#172a3a;--muted:#64748b;--bg:#f4f7f8;--accent:#146b68;--line:#dce5e8;--gold:#eebf65}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:920px;margin:auto;padding:32px 22px 60px}header{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 30px;margin-bottom:18px}h1{font-size:27px;margin:0 0 8px}header p{color:var(--muted);margin:0}.badge{color:var(--accent);font-weight:700;letter-spacing:.04em;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar select,.toolbar button,.btn{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:white;color:var(--ink);font:inherit;cursor:pointer}.toolbar button.primary,.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.progress{height:8px;background:#e2e9eb;border-radius:9px;overflow:hidden;margin:14px 0 4px}.progress i{display:block;height:100%;background:var(--accent);width:0;transition:.2s}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 6px 24px #193b4a0b}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}.tag{background:#edf5f4;color:var(--accent);padding:3px 10px;border-radius:99px}.prompt{margin:26px 0 8px;font-size:15px;color:var(--muted)}.cn{font-size:23px;font-weight:700;margin:0 0 22px}.en{font-size:20px;border-left:3px solid var(--gold);padding:4px 0 4px 15px;margin:18px 0}.hidden{filter:blur(7px);user-select:none;cursor:pointer}.note{color:var(--muted);font-size:14px}.pattern{background:#f5f8fa;border-radius:12px;padding:16px;margin:16px 0}.pattern b{display:block;margin-bottom:6px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.small{font-size:14px}.inputrow{margin-top:20px}.inputrow textarea{width:100%;min-height:92px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}.feedback{min-height:26px;color:var(--accent);font-weight:600}.foot{margin:16px 4px;color:var(--muted);font-size:13px}@media(max-width:600px){.wrap{padding:15px}.card{padding:20px}.cn{font-size:20px}}
</style></head><body><main class="wrap"><header><div class="badge">S02E13 · 口语主动输出</div><h1>高级口语框架与短语练习</h1><p>先看中文提示，自己说英文；再揭晓表达。用替换槽把同一个框架迁移到自己的生活里。</p><div class="progress"><i id="bar"></i></div><div class="small" id="progressText"></div></header><div class="toolbar"><select id="category"><option value="all">全部主题</option></select><button id="shuffle">随机一题</button><button id="reset">从头练习</button></div><section class="card"><div class="top"><span id="count"></span><span class="tag" id="tag"></span></div><div class="prompt">请用英语表达</div><p class="cn" id="cn"></p><div id="answer" class="en hidden" title="点击显示答案"></div><div class="pattern"><b>框架拆解</b><span id="frame"></span><div class="note" id="tip"></div></div><div class="inputrow"><label class="small" for="myAnswer">我的版本（可选，写下或先大声说）</label><textarea id="myAnswer" placeholder="先开口说，再记录你自己的句子……"></textarea><div class="feedback" id="feedback"></div></div><div class="controls"><button class="btn primary" id="reveal">显示英文</button><button class="btn" id="speak">🔊 听示范</button><button class="btn" id="check">检查关键词</button><button class="btn" id="prev">← 上一题</button><button class="btn" id="next">下一题 →</button></div></section><p class="foot">练习建议：每题先不看答案说 2 遍；第二遍替换至少一个信息；最后把答案遮住，隔天复习。示例表达依据 S02E13 台词语境整理，部分拼写和语法已校正，练习句为迁移改写。</p></main><script>
const data=[
{c:'表达立场',zh:'如果你想介入我和丈夫之间，我不会放过你。',en:'If you’re trying to come between me and my husband, I’ll take you down.',frame:'If you’re trying to come between me and ___, I’ll ___.',tip:'come between A and B = 介入、挑拨两者关系；替换后半句，表达坚定警告。',keys:['come between','i’ll']},
{c:'表达立场',zh:'你尽管放马过来。',en:'Bring it on.',frame:'Bring ___ on.',tip:'简短有力的回应，表示接受挑战。语气要根据场合拿捏。',keys:['bring it on']},
{c:'提出理由',zh:'告诉我一个充分的理由，说明我为什么不该报警。',en:'Give me one good reason why I shouldn’t call the police.',frame:'Give me one good reason why I shouldn’t ___.',tip:'用来要求对方解释；shouldn’t 后接动词原形。',keys:['give me one good reason','why i shouldn’t']},
{c:'强调主题',zh:'如果说有一件事她最懂，那就是如何应对冲突。',en:'If there’s one thing she understood, it was the nature of conflict.',frame:'If there’s one thing ___ understands, it’s ___.',tip:'If there’s one thing… it’s… 用来突出一个人最擅长或最了解的事。',keys:['if there’s one thing','it']},
{c:'建议与请求',zh:'你能把衣服放进洗衣篮吗？',en:'Could you put your clothes in the hamper?',frame:'Could you put ___ in the ___?',tip:'Could you…? 礼貌提出具体请求；hamper 指洗衣篮。',keys:['could you','put']},
{c:'表达偏好',zh:'我今晚特别想吃中餐。',en:'I’ve got a hankering for Chinese food tonight.',frame:'I’ve got a hankering for ___ tonight.',tip:'have a hankering for = 特别想要/想吃，语气口语、轻松。',keys:['hankering for']},
{c:'表达厌倦',zh:'我米饭吃腻了，咱们吃披萨吧。',en:'I’m so over rice. Let’s do pizza.',frame:'I’m so over ___. Let’s do ___.',tip:'I’m so over… = 我对……腻了；Let’s do… 可自然提出替代方案。',keys:['i’m so over','let’s do']},
{c:'表达重要性',zh:'这件事对我很重要。',en:'This is important to me.',frame:'___ is important to me.',tip:'把主语替换成目标、关系、计划等，清楚表达个人优先级。',keys:['important to me']},
{c:'表达看法',zh:'你觉得怎么样？',en:'What do you think of that?',frame:'What do you think of ___?',tip:'征求意见的万能问法；that 可换成具体方案或名词。',keys:['what do you think of']},
{c:'惊讶与追问',zh:'他到底在这里干什么？',en:'What on earth is he doing here?',frame:'What on earth is ___ doing ___?',tip:'What on earth…? 加强惊讶或不解；日常也可用 What is…?。',keys:['what on earth']},
{c:'提出异议',zh:'你疯了吗？',en:'Have you lost your mind?',frame:'Have you lost your ___?',tip:'表达强烈反对，语气较重。温和替代：Are you sure that’s a good idea?',keys:['lost your mind']},
{c:'表达顾虑',zh:'我们可以保护他，同时不把他当成动物一样对待。',en:'We can protect him without treating him like an animal.',frame:'We can ___ without ___-ing.',tip:'without + 动名词，表达“做到A，同时避免B”。适合提出平衡方案。',keys:['without','ing']},
{c:'说明原因',zh:'既然我也要承担风险，我就有发言权。',en:'Since I share the risk, I get a say.',frame:'Since I ___, I get a say.',tip:'Since 在句首说明原因；get a say = 有发言权。',keys:['since','risk']},
{c:'礼貌致谢',zh:'我想感谢哈珀太太帮忙筹办聚餐。',en:'I’d like to acknowledge Mrs. Harper for organizing the potluck.',frame:'I’d like to acknowledge ___ for ___.',tip:'正式或半正式场合表达感谢。acknowledge someone for… 比 say thanks 更郑重。',keys:['i’d like to acknowledge','for']},
{c:'表达不耐烦',zh:'别再说了，别像坏掉的唱片一样重复。',en:'Knock it off. You sound like a broken record.',frame:'Knock it off. You sound like a broken ___.',tip:'knock it off = 别闹了/打住；broken record 指反复唠叨。口气直接。',keys:['knock it off','broken record']},
{c:'道歉与承诺',zh:'我为儿子的行为道歉，这种事不会再发生。',en:'I apologize for my son’s behavior. It won’t happen again.',frame:'I apologize for ___. It won’t happen again.',tip:'适合承担责任并承诺改正；apologize for + 名词或动名词。',keys:['i apologize for','won’t happen again']},
{c:'提出想法',zh:'你想一起过一遍，再碰撞一些想法吗？',en:'Do you want to go over it and toss some ideas around?',frame:'Do you want to go over ___ and toss some ideas around?',tip:'go over = 一起检查/过一遍；toss ideas around = 随意讨论、碰撞想法。',keys:['go over','ideas around']},
{c:'鼓励行动',zh:'来吧，我们一起把这件难事搞定。',en:'Come on, let’s do this. Let’s nail this.',frame:'Come on, let’s ___. Let’s nail this.',tip:'nail it / nail this = 出色完成、拿下。适合给自己或队友打气。',keys:['let’s','nail']},
{c:'自我修正',zh:'没关系，我才刚找回状态，我知道自己还能做得更好。',en:'Whatever. I’m just knocking the rust off. I know I can do better.',frame:'I’m just knocking the rust off. I know I can do better.',tip:'knock the rust off = 找回生疏后丢掉的手感；可用于技能、运动、语言练习。',keys:['knocking the rust off','i can do better']},
{c:'询问进展',zh:'进展怎么样？',en:'How is it going?',frame:'How is ___ going?',tip:'询问工作、计划、学习进展；回答可用 It’s going well / Not so well.。',keys:['how is','going']},
{c:'征求同意',zh:'你觉得这个想法怎么样？',en:'What do you think of that?',frame:'What do you think of ___?',tip:'把 that 换成你刚提出的建议；练习时补充理由：I think it could work because…',keys:['what do you think of']},
{c:'表达暂时性',zh:'这只是暂时的；等你康复后，情况就会改变。',en:'It’s only temporary. Once you’re well, things will change.',frame:'It’s only temporary. Once ___, ___.',tip:'once 引导“等到/一旦”；用来说明当前状态有期限。',keys:['only temporary','once']},
{c:'自然收尾',zh:'我想我该走了。',en:'I guess I’d better get going.',frame:'I guess I’d better get ___. ',tip:'自然、礼貌地结束拜访或谈话。I’d better… 表示“我最好……”。',keys:['i’d better get going']},
{c:'表达感受',zh:'有时候这确实会让我有点紧张。',en:'Sometimes it actually makes me a little nervous.',frame:'Sometimes it actually makes me a little ___.',tip:'actually 在这里加强“确实”；用 nervous、uneasy、awkward 等替换感受词。',keys:['sometimes','makes me','nervous']}
];
let list=[...data],idx=0,seen=new Set();const $=x=>document.getElementById(x);function render(){const d=list[idx];$('count').textContent=`第 ${idx+1} / ${list.length} 题`;$('tag').textContent=d.c;$('cn').textContent=d.zh;$('answer').textContent=d.en;$('answer').classList.add('hidden');$('frame').textContent=d.frame;$('tip').textContent=d.tip;$('myAnswer').value='';$('feedback').textContent='';$('reveal').textContent='显示英文';$('bar').style.width=(seen.size/list.length*100)+'%';$('progressText').textContent=`已练习 ${seen.size} / ${list.length} 题`;}
function reveal(){ $('answer').classList.remove('hidden');$('reveal').textContent='英文已显示';seen.add(idx);$('bar').style.width=(seen.size/list.length*100)+'%';$('progressText').textContent=`已练习 ${seen.size} / ${list.length} 题`;}
const sel=$('category');[...new Set(data.map(x=>x.c))].forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o)});sel.onchange=()=>{list=sel.value==='all'?[...data]:data.filter(x=>x.c===sel.value);idx=0;seen.clear();render()};$('answer').onclick=reveal;$('reveal').onclick=reveal;$('next').onclick=()=>{idx=(idx+1)%list.length;render()};$('prev').onclick=()=>{idx=(idx-1+list.length)%list.length;render()};$('shuffle').onclick=()=>{idx=Math.floor(Math.random()*list.length);render()};$('reset').onclick=()=>{idx=0;seen.clear();render()};$('speak').onclick=()=>{if(!('speechSynthesis'in window)){alert('当前浏览器不支持语音朗读。');return}let u=new SpeechSynthesisUtterance(list[idx].en);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)};$('check').onclick=()=>{let a=$('myAnswer').value.toLowerCase();if(!a.trim()){$('feedback').textContent='先写下你刚才说的句子，或大声说一遍。';return}let matched=list[idx].keys.filter(k=>a.includes(k));$('feedback').textContent=matched.length?`找到 ${matched.length} 个框架关键词：${matched.join(' · ')}。对照上面的句型，看看还能怎样改得更自然。`:'没有检测到目标短语；先确认是否用了句型核心部分。关键词只作自查，不代表完整语法评分。';};render();
</script></body></html>
